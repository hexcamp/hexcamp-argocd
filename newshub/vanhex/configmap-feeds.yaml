apiVersion: v1
kind: ConfigMap
metadata:
  name: feeds
data:
  # file-like keys
  cbc_bc.env: |
    BLUESKY_USERNAME=jim+cbc-bc@jimpick.com
  cbc_bc.feeds: |
    https://www.cbc.ca/webfeed/rss/rss-canada-britishcolumbia
  dailyhive_van.env: |
    BLUESKY_USERNAME=jim+dailyhive-van@jimpick.com
  dailyhive_van.feeds: |
    https://dailyhive.com/feed/vancouver
  citynews_van.env: |
    BLUESKY_USERNAME=jim+citynews-van@jimpick.com
  citynews_van.feeds: |
    https://vancouver.citynews.ca/feed/
  globalnews_bc.env: |
    BLUESKY_USERNAME=jim+globalnews-bc@jimpick.com
  globalnews_bc.feeds: |
    https://globalnews.ca/bc/feed/
  thethunderbird.env: |
    BLUESKY_USERNAME=jim+thethunderbird@jimpick.com
  thethunderbird.feeds: |
    https://thethunderbird.ca/feed/
