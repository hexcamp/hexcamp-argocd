apiVersion: batch/v1
kind: CronJob
metadata:
  name: feeds-cbc-bc
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: run-feed
            image: curlimages/curl
            args: ["curl", "-X", "POST", "--data", "{\"feed\": \"cbc_bc\"}", "el-blueskybot.newshub-vanhex.svc.cluster.local:8080"]
          restartPolicy: Never
