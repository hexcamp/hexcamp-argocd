apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: blueskybot
  namespace: newshub-vanhex
spec:
  params:
    - name: feed
      type: string
  steps:
    - name: blueskybot
      image: ghcr.io/hexcamp/blueskybot@sha256:91a27b8acf35a0146e23a3f54d7b4a6550b636bea7879f5e5330d9f914165827
      envFrom:
      - secretRef:
          name: atproto-secrets
      script: |
        #!/bin/sh
        echo "Hello $(params.feed)"
        echo "Secret: $(params.feed)_password = $$(params.feed)_password"
        sleep 600
        echo "Done"
      volumeMounts:
      - name: feeds
        mountPath: "/feeds"
        readOnly: true
  workspaces:
  - name: data
    description: | 
      PVC for the lastPostedLinks.json file
  volumes:
  - name: feeds
    configMap:
      name: feeds
