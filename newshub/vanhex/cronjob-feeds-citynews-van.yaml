apiVersion: batch/v1
kind: CronJob
metadata:
  name: feeds-citynews-van
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: run-feed
            image: curlimages/curl
            args: ["curl", "-X", "POST", "--data", "{\"feed\": \"citynews_van\"}", "el-blueskybot.newshub-vanhex.svc.cluster.local:8080"]
          restartPolicy: Never
